<footer class="footer"><div class="wrap">
  <span class="site-tag">{{ .Site.Title }}</span>
  <nav class="footer-row footer-nav" aria-label="Footer">
    {{- range .Site.Menus.main }}
    <a href="{{ .URL }}"{{ if hasPrefix .URL "http" }} rel="noopener"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
  <div class="footer-row">
    <span>{{ .Site.Params.position }}, {{ .Site.Params.affiliation }}</span>
    {{- range .Site.Params.links }}
    <a href="{{ .url }}"{{ if hasPrefix .url "http" }} rel="noopener"{{ end }}>{{ .name }}</a>
    {{- end }}
  </div>
  <div>Updated {{ now.Format "January 2006" }}</div>
</div></footer>
