params:
  author: Gauti B. Eggertsson
  description: "Gauti B. Eggertsson is a macroeconomist, the Dupee Family Professor of Social Sciences and Professor of Economics at the Economics Department, Brown University. His work analyzes monetary and fiscal policy over the business cycle, from a modern and a historical perspective."
  affiliation: "Economics Department, Brown University"
  position: "Dupee Family Professor of Social Sciences and Professor of Economics"
  email: gauti_eggertsson@brown.edu
  photo: gauti_pic.jpg
  # External profiles shown as chips on the home page and in the footer.
  links:
    - name: Email
      url: mailto:gauti_eggertsson@brown.edu
    - name: Google Scholar
      url: https://scholar.google.com/citations?user=6-MmtygAAAAJ&hl=en
    - name: RePEc
      url: https://ideas.repec.org/e/peg7.html
    - name: Brown University
      url: https://economics.brown.edu/people/gauti-eggertsson
    - name: Blog
      url: https://gautieggertsson.blogspot.com/
  # Papers featured on the home page, in this order. Paths are relative to /content.
  featured:
    - /research/the-forward-guidence-puzzle-is-not-a-puzzle
    - /research/a-unified-theory-of-the-great-depression-and-the-great-recession
